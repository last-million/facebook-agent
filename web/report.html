<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Rapport des runs — Facebook autopilot</title>
<style>
  :root{
    --bg:#0e1217; --bg2:#141a22; --card:#1a222c; --card2:#202a36; --line:#27323f;
    --tx:#e6edf3; --mut:#8b98a8; --dim:#5d6b7c;
    --blue:#4ea1ff; --green:#3fb950; --amber:#d6a531; --red:#f0625a; --violet:#a779e9;
    --r:14px; --sh:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 75% -10%,#16202b 0,var(--bg) 55%) fixed;
    color:var(--tx); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:max(14px,env(safe-area-inset-top)) 14px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  /* top bar */
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top h1{font-size:1.22rem;margin:0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.16)}
  .sub{color:var(--mut);font-size:.82rem;margin-top:3px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx);
    padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--card2);border-color:#37475a}
  .btn:active{transform:translateY(1px)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:.82rem;user-select:none;cursor:pointer}
  .toggle input{accent-color:var(--blue);width:16px;height:16px}
  .upd{color:var(--dim);font-size:.76rem;white-space:nowrap}
  /* run chips */
  .chips{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;cursor:pointer;
    min-width:118px;transition:.15s}
  .chip:hover{border-color:#3a4b5e}
  .chip.on{border-color:var(--blue);background:linear-gradient(180deg,#1d2937,#172029);box-shadow:0 0 0 1px var(--blue) inset}
  .chip .cd{font-size:.74rem;color:var(--mut)}
  .chip .cp{font-size:1.02rem;font-weight:700;margin-top:2px}
  .chip .cc{font-size:.74rem;margin-top:2px}
  .badge{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:#06210f;background:var(--green);border-radius:5px;padding:1px 6px;margin-bottom:5px}
  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin:6px 0 18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.85}
  .stat.g::before{background:var(--green)} .stat.a::before{background:var(--amber)}
  .stat.r::before{background:var(--red)} .stat.v::before{background:var(--violet)}
  .stat .k{color:var(--mut);font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:1.75rem;font-weight:760;margin-top:5px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:.95rem;color:var(--mut);font-weight:600}
  .stat .x{color:var(--dim);font-size:.74rem;margin-top:3px}
  /* section */
  h2{font-size:.95rem;color:var(--tx);margin:22px 0 11px;font-weight:700;display:flex;align-items:center;gap:8px}
  h2 .ln{flex:1;height:1px;background:var(--line)}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
  .grp .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .grp .gn{font-weight:700;font-size:.95rem}
  .grp .tag{font-size:.68rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .grp .row{display:flex;justify-content:space-between;font-size:.84rem;padding:4px 0;color:var(--mut)}
  .grp .row b{color:var(--tx);font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:5px;background:#0c1116;overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#57d06a);border-radius:5px}
  .bar.warn > i{background:linear-gradient(90deg,var(--amber),#e6bf52)}
  .bar.bad  > i{background:linear-gradient(90deg,var(--red),#f6837c)}
  /* table */
  .tablecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead th{text-align:left;color:var(--mut);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;
    padding:11px 13px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0}
  tbody td{padding:10px 13px;border-bottom:1px solid #1d262f;font-variant-numeric:tabular-nums;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#192129}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 8px}
  .pill.o{color:#b98bff;background:rgba(167,121,233,.13)}
  .pill.f{color:#5fb6ff;background:rgba(78,161,255,.13)}
  .pill.x{color:var(--mut);background:rgba(139,152,168,.12)}
  .ok{color:var(--green)} .no{color:var(--red);font-weight:600} .slow{color:var(--amber)}
  .hist td{cursor:pointer}
  .empty{padding:46px 20px;text-align:center;color:var(--mut)}
  .err{background:rgba(240,98,90,.1);border:1px solid rgba(240,98,90,.35);color:#ffb4ae;border-radius:12px;padding:14px 16px;margin:14px 0;font-size:.86rem}
  .foot{color:var(--dim);font-size:.74rem;text-align:center;margin-top:26px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  /* responsive: detail table -> stacked cards on phones */
  @media(max-width:640px){
    body{padding:12px 10px 50px}
    .top h1{font-size:1.08rem}
    .stat .v{font-size:1.5rem}
    table.detail thead{display:none}
    table.detail,table.detail tbody,table.detail tr,table.detail td{display:block;width:100%}
    table.detail tr{border-bottom:1px solid var(--line);padding:8px 4px}
    table.detail td{border:0;padding:4px 13px;display:flex;justify-content:space-between;gap:12px}
    table.detail td::before{content:attr(data-l);color:var(--mut);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1><span class="dot"></span> Rapport des runs</h1>
      <div class="sub">Facebook autopilot — généré automatiquement depuis les logs (sans IA)</div>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="auto" checked> Auto 60s</label>
      <span class="upd" id="upd"></span>
      <button class="btn" id="refresh">↻ Rafraîchir</button>
    </div>
  </div>

  <div id="err"></div>
  <div class="chips" id="chips"></div>
  <div id="body"><div class="empty"><span class="spin"></span> Chargement du rapport…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
var TOKEN = "__DASHBOARD_TOKEN__";
var DATA = null, SEL = 0, timer = null;

function fmtTime(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ return "—"; } }
function fmtDate(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleDateString([], {day:"2-digit",month:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch(e){ return "—"; } }
function fmtGap(s){ if(s==null) return "—"; if(s<90) return s+"s"; return (s/60).toFixed(1)+"m"; }
function gapClass(s){ if(s==null) return "no"; if(s>180) return "slow"; return "ok"; }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
function grpPill(g){ var c = g==="o-group"?"o":(g==="4854"?"f":"x"); return '<span class="pill '+c+'">'+esc(g)+'</span>'; }
function rateBar(p){ var cls = p>=90?"":(p>=70?"warn":"bad"); return '<div class="bar '+cls+'"><i style="width:'+Math.max(2,Math.min(100,p))+'%"></i></div>'; }

function load(force){
  var u = "/api/reports/runs" + (force?"?force=1":"");
  document.getElementById("refresh").innerHTML = '<span class="spin"></span> …';
  fetch(u, { headers: { "x-dashboard-token": TOKEN }, cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ DATA=j; document.getElementById("err").innerHTML=""; if(SEL>=(j.runs||[]).length) SEL=0; render(); })
    .catch(function(e){ document.getElementById("err").innerHTML='<div class="err">⚠ Impossible de charger le rapport : '+esc(e.message)+' — ouvre cette page via <b>/report</b> (le serveur injecte le token).</div>'; })
    .finally(function(){ document.getElementById("refresh").innerHTML="↻ Rafraîchir"; });
}

function render(){
  if(!DATA){ return; }
  document.getElementById("upd").textContent = "MAJ " + fmtTime(DATA.generatedAt);
  document.getElementById("foot").textContent = (DATA.runCount||0)+" run(s) détectée(s) — source : facebook-live-posts.jsonl + events.log + watchdog";
  var runs = DATA.runs || [];
  // chips
  var ch = runs.map(function(r,i){
    var rate=r.commentRate;
    return '<div class="chip '+(i===SEL?"on":"")+'" onclick="pick('+i+')">'
      + (i===0?'<div class="badge">Dernière</div>':'')
      + '<div class="cd">'+esc(fmtDate(r.startedAt))+'</div>'
      + '<div class="cp">'+r.posts+' posts</div>'
      + '<div class="cc '+(rate>=90?"ok":rate>=70?"slow":"no")+'">'+rate+'% commentés</div></div>';
  }).join("");
  document.getElementById("chips").innerHTML = ch || "";
  var r = runs[SEL];
  var b = document.getElementById("body");
  if(!r){ b.innerHTML='<div class="tablecard"><div class="empty">Aucune run enregistrée pour le moment.<br>Le rapport se remplira dès le premier post.</div></div>'; return; }

  // stat cards
  var ramTxt = r.minRamPct==null ? "—" : (r.minRamPct+"%");
  var chrTxt = r.chromePeak==null ? "—" : r.chromePeak;
  var html = ''
    + '<div class="stats">'
    + statCard("Posts publiés", r.posts, "sur "+r.durationMin+" min", "")
    + statCard("Commentés", r.commentRate+'<small>%</small>', r.commented+"/"+r.posts+" • "+r.uncommented+" sans", r.commentRate>=90?"g":(r.commentRate>=70?"a":"r"))
    + statCard("Délai médian", fmtGap(r.gap.medianSec), "max "+fmtGap(r.gap.maxSec), "v")
    + statCard("Pic Chrome", chrTxt, "RAM libre min "+ramTxt, (r.chromePeak&&r.chromePeak>120)?"r":"g")
    + statCard("Redémarrages", r.restarts, r.restarts? "serveur relancé":"aucun — stable", r.restarts?"a":"g")
    + '</div>';

  // per-group
  var gks = Object.keys(r.byGroup||{});
  if(gks.length){
    html += '<h2>Par groupe <span class="ln"></span></h2><div class="cards2">';
    html += gks.map(function(g){
      var v=r.byGroup[g];
      return '<div class="grp"><div class="gh"><span class="gn">'+grpPill(g)+'</span><span class="tag">'+v.posts+' posts</span></div>'
        + '<div class="row"><span>Commentés</span><b>'+v.commented+'/'+v.posts+'</b></div>'
        + '<div class="row"><span>Taux</span><b class="'+(v.commentRate>=90?"ok":v.commentRate>=70?"slow":"no")+'">'+v.commentRate+'%</b></div>'
        + '<div class="row"><span>Délai médian</span><b>'+fmtGap(v.gapMedianSec)+'</b></div>'
        + rateBar(v.commentRate)+'</div>';
    }).join("");
    html += '</div>';
  }

  // detail table
  html += '<h2>Détail des posts <span class="ln"></span></h2><div class="tablecard"><table class="detail"><thead><tr>'
    + '<th>#</th><th>Groupe</th><th>Publié</th><th>Commenté</th><th>Délai</th><th>Profils</th></tr></thead><tbody>';
  html += (r.detail||[]).map(function(d,i){
    var prof = d.profilePub ? (d.profilePub + (d.profileCom? " → "+d.profileCom : " → —")) : "—";
    return '<tr>'
      + '<td data-l="#">'+(i+1)+'</td>'
      + '<td data-l="Groupe">'+grpPill(d.group)+'</td>'
      + '<td data-l="Publié">'+fmtTime(d.publishedAt)+'</td>'
      + '<td data-l="Commenté">'+(d.commentedAt?fmtTime(d.commentedAt):'<span class="no">non commenté</span>')+'</td>'
      + '<td data-l="Délai" class="'+gapClass(d.gapSec)+'">'+fmtGap(d.gapSec)+'</td>'
      + '<td data-l="Profils">'+esc(prof)+'</td></tr>';
  }).join("");
  html += '</tbody></table></div>';

  // history
  if(runs.length>1){
    html += '<h2>Historique des runs <span class="ln"></span></h2><div class="tablecard"><table class="hist"><thead><tr>'
      + '<th>Run</th><th>Posts</th><th>Commentés</th><th>Délai méd.</th><th>Chrome</th><th>Restart</th><th>Durée</th></tr></thead><tbody>';
    html += runs.map(function(rr,i){
      return '<tr onclick="pick('+i+')"'+(i===SEL?' style="background:#192633"':'')+'>'
        + '<td>'+esc(fmtDate(rr.startedAt))+(i===0?' <span class="pill x">dernière</span>':'')+'</td>'
        + '<td>'+rr.posts+'</td>'
        + '<td class="'+(rr.commentRate>=90?"ok":rr.commentRate>=70?"slow":"no")+'">'+rr.commentRate+'%</td>'
        + '<td>'+fmtGap(rr.gap.medianSec)+'</td>'
        + '<td>'+(rr.chromePeak==null?"—":rr.chromePeak)+'</td>'
        + '<td class="'+(rr.restarts?"slow":"ok")+'">'+rr.restarts+'</td>'
        + '<td>'+rr.durationMin+'m</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  b.innerHTML = html;
}
function statCard(k,v,x,cls){ return '<div class="stat '+(cls||"")+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="x">'+esc(x)+'</div></div>'; }
function pick(i){ SEL=i; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function arm(){ if(timer) clearInterval(timer); if(document.getElementById("auto").checked){ timer=setInterval(function(){ load(false); }, 60000); } }
document.getElementById("refresh").addEventListener("click", function(){ load(true); });
document.getElementById("auto").addEventListener("change", arm);
load(false); arm();
</script>
</body>
</html>
