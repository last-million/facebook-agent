<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Rapport des runs — Facebook autopilot</title>
<style>
  :root{
    --bg:#0e1217; --bg2:#141a22; --card:#1a222c; --card2:#202a36; --line:#27323f;
    --tx:#e6edf3; --mut:#8b98a8; --dim:#5d6b7c;
    --blue:#4ea1ff; --green:#3fb950; --amber:#d6a531; --red:#f0625a; --violet:#a779e9;
    --r:14px; --sh:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 75% -10%,#16202b 0,var(--bg) 55%) fixed;
    color:var(--tx); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:max(14px,env(safe-area-inset-top)) 14px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top h1{font-size:1.22rem;margin:0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.16)}
  .sub{color:var(--mut);font-size:.82rem;margin-top:3px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx);
    padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--card2);border-color:#37475a}
  .btn:active{transform:translateY(1px)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:.82rem;user-select:none;cursor:pointer}
  .toggle input{accent-color:var(--blue);width:16px;height:16px}
  .upd{color:var(--dim);font-size:.76rem;white-space:nowrap}
  /* LIVE banner */
  .livecard{background:linear-gradient(180deg,#142433,#111a22);border:1px solid #2a4258;border-radius:14px;padding:14px 16px;margin:4px 0 16px;box-shadow:var(--sh)}
  .livecard .lh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.98rem;color:#bfe0ff}
  .livecard .lblink{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.18);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(63,185,80,0)}}
  .livecard .lp{color:var(--mut);font-size:.86rem;margin:7px 0 2px}
  .livecard .lp b{color:var(--tx);font-variant-numeric:tabular-nums}
  /* run accordion */
  .runcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
  .runcard[open]{border-color:#33485c}
  .runcard > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:14px 15px;user-select:none}
  .runcard > summary::-webkit-details-marker{display:none}
  .runcard > summary:hover{background:var(--card2)}
  .rchev{color:var(--mut);font-size:.85rem;transition:transform .15s;flex:0 0 auto;width:12px}
  .runcard[open] .rchev{transform:rotate(90deg)}
  .rmain{display:flex;align-items:center;gap:8px;min-width:0}
  .rdate{font-weight:700;font-size:.92rem;white-space:nowrap}
  .rlive{font-size:.62rem;font-weight:800;letter-spacing:.5px;color:#06210f;background:var(--green);border-radius:5px;padding:2px 7px;animation:pulse 1.4s infinite}
  .rposts{color:var(--mut);font-size:.84rem;white-space:nowrap}
  .rrate{font-weight:700;font-size:.98rem;white-space:nowrap;margin-left:auto}
  .rrate small{font-size:.72rem;color:var(--mut);font-weight:600}
  .runc{font-size:.72rem;color:var(--red);white-space:nowrap;font-weight:600}
  .runc.pending{color:var(--amber)}
  .rdel{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1;transition:.15s}
  .rdel:hover{background:rgba(240,98,90,.14);border-color:rgba(240,98,90,.5);color:#ff8a83}
  .rbody{padding:6px 15px 16px;border-top:1px solid var(--line)}
  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin:12px 0 6px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.85}
  .stat.g::before{background:var(--green)} .stat.a::before{background:var(--amber)}
  .stat.r::before{background:var(--red)} .stat.v::before{background:var(--violet)}
  .stat .k{color:var(--mut);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:1.6rem;font-weight:760;margin-top:5px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:.92rem;color:var(--mut);font-weight:600}
  .stat .x{color:var(--dim);font-size:.73rem;margin-top:3px}
  h2{font-size:.9rem;color:var(--tx);margin:18px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
  h2 .ln{flex:1;height:1px;background:var(--line)}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .grp{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
  .grp .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .grp .row{display:flex;justify-content:space-between;font-size:.84rem;padding:4px 0;color:var(--mut)}
  .grp .row b{color:var(--tx);font-variant-numeric:tabular-nums}
  .tag{font-size:.68rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .bar{height:7px;border-radius:5px;background:#0c1116;overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#57d06a);border-radius:5px;transition:width .4s}
  .bar.warn > i{background:linear-gradient(90deg,var(--amber),#e6bf52)}
  .bar.bad  > i{background:linear-gradient(90deg,var(--red),#f6837c)}
  .tablecard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead th{text-align:left;color:var(--mut);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;
    padding:10px 12px;background:#10161d;border-bottom:1px solid var(--line)}
  tbody td{padding:9px 12px;border-bottom:1px solid #1d262f;font-variant-numeric:tabular-nums;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#192129}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 8px}
  .pill.x{color:var(--mut);background:rgba(139,152,168,.12)}
  .pill.c0{color:#b98bff;background:rgba(167,121,233,.13)}
  .pill.c1{color:#5fb6ff;background:rgba(78,161,255,.13)}
  .pill.c2{color:#6bcf8f;background:rgba(63,185,80,.13)}
  .pill.c3{color:#f0cd72;background:rgba(214,165,49,.13)}
  .pill.c4{color:#ff9d7a;background:rgba(240,120,80,.13)}
  .pill.c5{color:#7ad4d0;background:rgba(60,180,175,.13)}
  .ok{color:var(--green)} .no{color:var(--red);font-weight:600} .slow{color:var(--amber)}
  .empty{padding:46px 20px;text-align:center;color:var(--mut)}
  .err{background:rgba(240,98,90,.1);border:1px solid rgba(240,98,90,.35);color:#ffb4ae;border-radius:12px;padding:14px 16px;margin:14px 0;font-size:.86rem}
  .reco{border-radius:11px;padding:11px 15px;margin:2px 0 14px;font-size:.86rem;font-weight:500}
  .reco.warn{background:rgba(214,165,49,.12);border:1px solid rgba(214,165,49,.4);color:#f0cd72}
  .reco.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.32);color:#7ee08a}
  .reco b{font-weight:800}
  .foot{color:var(--dim);font-size:.74rem;text-align:center;margin-top:26px}
  .foot a{color:var(--dim)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media(max-width:640px){
    body{padding:12px 10px 50px}
    .top h1{font-size:1.08rem}
    .rposts{display:none}
    .stat .v{font-size:1.4rem}
    table.detail thead{display:none}
    table.detail,table.detail tbody,table.detail tr,table.detail td{display:block;width:100%}
    table.detail tr{border-bottom:1px solid var(--line);padding:8px 4px}
    table.detail td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:12px}
    table.detail td::before{content:attr(data-l);color:var(--mut);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  }
  .scrollTopBtn{position:fixed;right:20px;bottom:20px;z-index:89;width:44px;height:44px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:50%;background:var(--card2);color:var(--tx);font-size:1.05rem;line-height:1;
    cursor:pointer;box-shadow:var(--sh);opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease,border-color .15s}
  .scrollTopBtn.isVisible{opacity:1;transform:translateY(0);pointer-events:auto}
  .scrollTopBtn:hover{border-color:var(--blue);color:var(--blue)}
  .scrollTopBtn:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1><span class="dot"></span> Rapport des runs</h1>
      <div class="sub">Facebook autopilot — généré depuis les logs (sans IA). Clique une carte pour la dérouler.</div>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="auto" checked> Auto 30s</label>
      <span class="upd" id="upd"></span>
      <button class="btn" id="hideAll" title="Masquer toutes les runs actuellement affichées (non destructif — les posts restent sur Facebook)">🗑 Masquer tout</button>
      <button class="btn" id="refresh">↻ Rafraîchir</button>
    </div>
  </div>

  <div id="err"></div>
  <div id="reco"></div>
  <div id="pendingunclustered"></div>
  <div id="openbudget"></div>
  <div id="live"></div>
  <div id="runs"><div class="empty"><span class="spin"></span> Chargement du rapport…</div></div>
  <div id="probprof"></div>

  <div class="foot" id="foot"></div>
</div>

<button id="scrollTopBtn" class="scrollTopBtn" type="button" title="Remonter en haut" aria-label="Remonter en haut">&#8593;</button>

<script>
"use strict";
var TOKEN = "__DASHBOARD_TOKEN__";
var DATA = null, timer = null;
var OPEN = new Set(); // startedAt of cards the operator expanded — preserved across auto-refresh

function fmtTime(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ return "—"; } }
function fmtDate(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch(e){ return "—"; } }
function fmtGap(s){ if(s==null) return "—"; if(s<90) return s+"s"; return (s/60).toFixed(1)+"m"; }
function gapClass(s){ if(s==null) return "no"; if(s>180) return "slow"; return "ok"; }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
// GENERIC, N-GROUP-SCALABLE (2026-07-04 review fix): __reportGroupName no longer emits fixed literal names
// ("o-group"/"4854") for a hardcoded 2-group set, so a literal-string check here left every group looking
// identically grey. Hash the (arbitrary, any-length) group name into one of a small color palette instead --
// deterministic (the same group always gets the same color across a whole report) and scales to any group count
// without a code change; colors may repeat past 6 concurrent groups, but the group's real name/id is always the
// visible label, so identity is never ambiguous even if two groups share a color.
function grpPill(g){
  if (!g || g === "autre") return '<span class="pill x">'+esc(g)+'</span>';
  var h = 0; for (var i = 0; i < g.length; i++) { h = (h * 31 + g.charCodeAt(i)) | 0; }
  var idx = Math.abs(h) % 6;
  return '<span class="pill c'+idx+'">'+esc(g)+'</span>';
}
function rateBar(p){ var cls = p>=90?"":(p>=70?"warn":"bad"); return '<div class="bar '+cls+'"><i style="width:'+Math.max(2,Math.min(100,p))+'%"></i></div>'; }
function statCard(k,v,x,cls){ return '<div class="stat '+(cls||"")+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="x">'+esc(x)+'</div></div>'; }

function load(force){
  var u = "/api/reports/runs" + (force?"?force=1":"");
  document.getElementById("refresh").innerHTML = '<span class="spin"></span> …';
  fetch(u, { headers: { "x-dashboard-token": TOKEN }, cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ DATA=j; document.getElementById("err").innerHTML=""; render(); })
    .catch(function(e){ document.getElementById("err").innerHTML='<div class="err">⚠ Impossible de charger le rapport : '+esc(e.message)+' — ouvre cette page via <b>/report</b> (le serveur injecte le token).</div>'; })
    .finally(function(){ document.getElementById("refresh").innerHTML="↻ Rafraîchir"; });
}

function render(){
  if(!DATA) return;
  document.getElementById("upd").textContent = "MAJ " + fmtTime(DATA.generatedAt);
  document.getElementById("foot").textContent = (DATA.runCount||0)+" run(s) — source : facebook-live-posts.jsonl + events.log + watchdog";

  // global banners (reconcile / open-budget / problem accounts)
  renderGlobals();

  // LIVE run banner
  var lv = DATA.live || {};
  var liveEl = document.getElementById("live");
  if (lv.armed) {
    var tgt = lv.target || null;
    var done = lv.postedThisRun || 0;
    var pct = tgt ? Math.min(100, Math.round(done/tgt*100)) : null;
    liveEl.innerHTML = '<div class="livecard">'
      + '<div class="lh"><span class="lblink"></span> Run en cours</div>'
      + '<div class="lp"><b>'+done+'</b>'+(tgt? ' / <b>'+tgt+'</b>' : '')+' posts publiés'+(pct!=null? ' &middot; '+pct+'%':'')+'</div>'
      + (pct!=null? rateBar(pct) : '') + '</div>';
  } else liveEl.innerHTML = '';

  // RUNS accordion (collapsed by default)
  var runs = DATA.runs || [];
  var runsEl = document.getElementById("runs");
  if(!runs.length){ runsEl.innerHTML = '<div class="tablecard"><div class="empty">Aucune run enregistrée pour le moment.<br>Le rapport se remplira dès le premier post.</div></div>'; return; }
  runsEl.innerHTML = runs.map(function(r,i){ return runCard(r,i); }).join("");
}

function runCard(r,i){
  var rate=r.commentRate;
  var sa = esc(r.startedAt);
  var ea = esc(r.endedAt || r.startedAt); // dismiss key = endedAt (restart-stable)
  var open = OPEN.has(r.startedAt) ? ' open' : '';
  return '<details class="runcard" data-sa="'+sa+'" ontoggle="onToggle(this)"'+open+'>'
    + '<summary>'
      + '<span class="rchev">▸</span>'
      + '<span class="rmain"><span class="rdate">'+esc(fmtDate(r.startedAt))+'</span>'
      + (r.live?'<span class="rlive">● EN COURS</span>':(i===0?'<span class="pill x">dernière</span>':''))+'</span>'
      + '<span class="rposts">'+r.posts+' posts &middot; '+r.durationMin+'m</span>'
      + '<span class="rrate '+(rate>=90?"ok":rate>=70?"slow":"no")+'">'+rate+'%<small> comm.</small></span>'
      + (r.uncommented? '<span class="runc">'+r.uncommented+' sans</span>':'')
      + ((r.pendingApproval&&r.pendingApproval.count)? '<span class="runc pending">'+r.pendingApproval.count+' en attente</span>':'')
      + '<button class="rdel" title="Supprimer cette run du rapport" onclick="dismiss(event,\''+sa+'\',\''+ea+'\')">✕</button>'
    + '</summary>'
    + '<div class="rbody">'+runBody(r)+'</div>'
    + '</details>';
}

function runBody(r){
  var ramTxt = r.minRamPct==null ? "—" : (r.minRamPct+"%");
  var chrTxt = r.chromePeak==null ? "—" : r.chromePeak;
  var html = '<div class="stats">'
    + statCard("Posts publiés", r.posts, "sur "+r.durationMin+" min", "")
    + statCard("Produits uniques", (r.uniqueProducts||0), (r.productsInBoth||0)+" dans les 2 groupes", (r.uniqueProducts? (r.productsInBoth>0?"g":"a") : ""))
    + statCard("Commentés", r.commentRate+'<small>%</small>', r.commented+"/"+r.posts+" • "+r.uncommented+" sans", r.commentRate>=90?"g":(r.commentRate>=70?"a":"r"))
    + statCard("Délai médian", fmtGap(r.gap.medianSec), "max "+fmtGap(r.gap.maxSec), "v")
    + statCard("Pic Chrome", chrTxt, "RAM libre min "+ramTxt, (r.chromePeak&&r.chromePeak>120)?"r":"g")
    + statCard("Redémarrages", r.restarts, r.restarts? "serveur relancé":"aucun — stable", r.restarts?"a":"g")
    + ((r.pendingApproval&&r.pendingApproval.count)? statCard("En attente d'approbation", r.pendingApproval.count, "modérateur pas encore passé", "a") : "")
    + '</div>';
  var gks = Object.keys(r.byGroup||{});
  if(gks.length){
    html += '<h2>Par groupe <span class="ln"></span></h2><div class="cards2">';
    html += gks.map(function(g){
      var v=r.byGroup[g];
      var stuck = !v.posts && v.held>0;
      return '<div class="grp"><div class="gh"><span>'+grpPill(g)+'</span><span class="tag">'+v.posts+' posts</span></div>'
        + (v.posts ? '<div class="row"><span>Commentés</span><b>'+v.commented+'/'+v.posts+'</b></div>'
          + '<div class="row"><span>Taux</span><b class="'+(v.commentRate>=90?"ok":v.commentRate>=70?"slow":"no")+'">'+v.commentRate+'%</b></div>'
          + '<div class="row"><span>Délai médian</span><b>'+fmtGap(v.gapMedianSec)+'</b></div>'
          + rateBar(v.commentRate) : (stuck ? '<div class="row"><span class="no">⚠ Aucun post — bloqué</span></div>' : '<div class="row"><span style="opacity:.6">Aucun post pour l\'instant</span></div>'))
        + (v.held>0 ? '<div class="row"><span>Retenus (aucun commentateur libre)</span><b class="'+(stuck?"no":"slow")+'">'+v.held+'</b></div>' : '')
        + '</div>';
    }).join("");
    html += '</div>';
  }
  // PAR PRODUIT — chaque produit harvested, son numéro, combien de fois posté, dans quels groupes, par quels profils
  var prods = r.products || [];
  if (prods.length) {
    html += '<h2>Par produit <span class="ln"></span> <span class="tag">'+(r.productsInBoth||0)+'/'+(r.uniqueProducts||prods.length)+' dans les 2 groupes</span></h2>';
    html += '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>Produit</th><th>Titre</th><th>Posté</th><th>Groupes</th><th>Profils</th></tr></thead><tbody>';
    html += prods.map(function(p){
      var gl = Object.keys(p.groups||{}).map(function(g){ return grpPill(g)+' ×'+p.groups[g]; }).join(' ');
      var multi = (p.groupCount>=2) ? '<span class="ok">✓ '+p.groupCount+' groupes</span>' : '<span class="slow">⚠ 1 seul</span>';
      var prof = (p.profiles||[]).join(', ');
      var ttl = (p.title||p.shortKey||'').toString();
      return '<tr>'
        + '<td data-l="Produit"><b>P'+p.num+'</b></td>'
        + '<td data-l="Titre" title="'+esc(p.key)+'">'+esc(ttl.length>46?ttl.slice(0,46)+'…':ttl)+'</td>'
        + '<td data-l="Posté"><b>'+p.total+'×</b> '+multi+'</td>'
        + '<td data-l="Groupes">'+gl+'</td>'
        + '<td data-l="Profils">'+esc(prof)+'</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  html += '<h2>Détail des posts <span class="ln"></span></h2><div class="tablecard"><table class="detail"><thead><tr>'
    + '<th>#</th><th>Produit</th><th>Groupe</th><th>Publié</th><th>Commenté</th><th>Délai</th><th>Profils</th></tr></thead><tbody>';
  html += (r.detail||[]).map(function(d,i){
    var prof = d.profilePub ? (d.profilePub + (d.profileCom? " → "+d.profileCom : " → —")) : "—";
    var pnum = d.productNum ? ('<span class="pill x" title="'+esc(d.productKey||"")+'">P'+d.productNum+'</span>') : '—';
    return '<tr>'
      + '<td data-l="#">'+(i+1)+'</td>'
      + '<td data-l="Produit">'+pnum+'</td>'
      + '<td data-l="Groupe">'+grpPill(d.group)+'</td>'
      + '<td data-l="Publié">'+fmtTime(d.publishedAt)+'</td>'
      + '<td data-l="Commenté">'+(d.commentedAt?(fmtTime(d.commentedAt)+(d.wasPendingApproval?' <span class="pill x" title="Ce post a attendu l\'approbation d\'un modérateur avant de pouvoir être commenté.">⏳ attente '+(d.approvalWaitMinutes!=null?d.approvalWaitMinutes+'min':'?')+'</span>':'')):(d.approvalVerification==="soft_clicked"?'<span class="slow">approbation en cours…</span>':'<span class="no">non commenté</span>'))+'</td>'
      + '<td data-l="Délai" class="'+gapClass(d.gapSec)+'">'+fmtGap(d.gapSec)+'</td>'
      + '<td data-l="Profils">'+esc(prof)+'</td></tr>';
  }).join("");
  html += '</tbody></table></div>';
  var pend = (r.pendingApproval && r.pendingApproval.items) || [];
  if (pend.length) {
    html += '<h2>En attente d\'approbation <span class="ln"></span> <span class="tag">'+pend.length+'</span></h2>';
    html += '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>Groupe</th><th>Soumis</th><th>Attente</th><th>Profil</th></tr></thead><tbody>';
    html += pend.map(function(p){
      var old = p.ageMinutes>=60;
      return '<tr>'
        + '<td data-l="Groupe">'+grpPill(p.group)+'</td>'
        + '<td data-l="Soumis">'+fmtTime(p.startedAt)+'</td>'
        + '<td data-l="Attente" class="'+(old?"no":"slow")+'">'+p.ageMinutes+' min'+(old?' ⚠':'')+'</td>'
        + '<td data-l="Profil">'+(p.profileId||'—')+'</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  return html;
}

function renderGlobals(){
  var rc = DATA.reconcile || {};
  var recoEl = document.getElementById("reco");
  var bits = [];
  if (rc.pending) bits.push('<b>'+rc.pending+'</b> interrompu(s), reprise en cours');
  if (rc.needsReview) bits.push('<b>'+rc.needsReview+'</b> à vérifier manuellement');
  if (rc.recovered) bits.push('<b>'+rc.recovered+'</b> récupéré(s)');
  if (rc.released) bits.push('<b>'+rc.released+'</b> relancé(s)');
  if (rc.pending || rc.needsReview) recoEl.innerHTML = '<div class="reco warn">⚠ Reprise après interruption (kill mid-post) : ' + bits.join(' · ') + '</div>';
  else if (rc.recovered || rc.released) recoEl.innerHTML = '<div class="reco ok">✓ Reprise auto après interruption : ' + bits.join(' · ') + ' — aucune perte silencieuse</div>';
  else recoEl.innerHTML = '';

  // PENDING, NO RUN YET (2026-07-04): posts awaiting moderator approval whose run has zero landed posts so far --
  // clustering (buildRunReports) only sees LANDED posts, so without this banner a run that's 100% pending right
  // now would be entirely invisible on the page.
  var pu = DATA.pendingUnclustered || [];
  var puEl = document.getElementById("pendingunclustered");
  if (pu.length) {
    var byG = {};
    pu.forEach(function(p){ byG[p.group] = (byG[p.group]||0)+1; });
    var bits2 = Object.keys(byG).map(function(g){ return '<b>'+byG[g]+'</b> '+g; });
    puEl.innerHTML = '<div class="reco warn">⏳ '+pu.length+' post(s) soumis, en attente d\'approbation modérateur (aucune run affichée pour l\'instant) : ' + bits2.join(' · ') + '</div>';
  } else { puEl.innerHTML = ''; }

  var ob = DATA.openBudget || null;
  var obEl = document.getElementById("openbudget");
  if (ob && (ob.opensToday || ob.effectiveLimit)) {
    var used = ob.opensToday || 0, lim = ob.effectiveLimit;
    var KOMODE = { force_on:'keep-open <b>forcé ON</b>', force_off:'keep-open <b>forcé OFF</b>', auto_on_tight_plan:'keep-open <b>auto ON</b> (plan serré)', auto_on_near_limit:'keep-open <b>auto ON</b> (proche limite)', auto_off_roomy_plan:'keep-open auto OFF (plan large)', auto_off_plan_unknown:'keep-open auto OFF (plan inconnu)' };
    var ko = KOMODE[ob.mode] || (ob.keepOpenOn ? 'keep-open ON' : 'keep-open off');
    var planSrc = ob.planLimit ? 'plan connu' : (ob.learnedLimit ? 'auto-appris' : '');
    var head, cls;
    if (lim) {
      var line = '<b>' + used + '</b> / ~' + lim + ' ouvertures aujourd\'hui (' + planSrc + (ob.pct != null ? ', ' + ob.pct + '%' : '') + ', reste ~' + ob.remaining + ') — ' + ko;
      cls = ob.nearLimit ? 'warn' : 'ok';
      head = (ob.nearLimit ? '⚠ Proche de la limite d\'ouvertures ixBrowser : ' : '✓ Budget d\'ouvertures ixBrowser : ') + line;
    } else { cls = 'ok'; head = '✓ Ouvertures ixBrowser aujourd\'hui : <b>' + used + '</b> — plan inconnu (auto-appris au 1er 1018) — ' + ko; }
    obEl.innerHTML = '<div class="reco ' + cls + '">' + head + '</div>';
  } else { obEl.innerHTML = ''; }

  var pp = DATA.problemProfiles || [];
  var ppEl = document.getElementById("probprof");
  if (pp.length) {
    var ppRows = pp.map(function (p) { return '<tr><td><b>p' + p.profileId + '</b></td><td class="no">' + p.realFails + '</td><td class="' + (p.unblocks ? 'slow' : '') + '">' + (p.unblocks || 0) + '</td><td>' + esc(p.lastReal || '—') + '</td></tr>'; }).join("");
    ppEl.innerHTML = '<h2>⚠ Comptes à problème (font perdre du temps) <span class="ln"></span></h2>'
      + '<div class="reco warn" style="margin:0 0 8px">Vrais échecs (accès groupe / blocage compte) sur 24h — <b>PAS</b> les victimes du quota ixBrowser (1018/1004).</div>'
      + '<div class="tablecard"><table><thead><tr><th>Profil</th><th>Échecs réels</th><th>Déblocages</th><th>Dernière raison</th></tr></thead><tbody>' + ppRows + '</tbody></table></div>';
  } else { ppEl.innerHTML = ''; }
}

function onToggle(el){ var sa=el.getAttribute("data-sa"); if(el.open) OPEN.add(sa); else OPEN.delete(sa); }

function dismiss(ev, sa, ea){
  ev.stopPropagation(); ev.preventDefault();
  if(!confirm("Supprimer cette run du rapport ? (les posts ne sont pas supprimés de Facebook — c'est juste masqué ici)")) return;
  fetch("/api/reports/runs/dismiss", { method:"POST", headers:{ "x-dashboard-token":TOKEN, "Content-Type":"application/json" }, body:JSON.stringify({ endedAt: ea || sa, startedAt: sa }) })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ OPEN.delete(sa); load(true); })
    .catch(function(e){ alert("Erreur suppression : "+e.message); });
}

function hideAll(){
  var n = (DATA && DATA.runs ? DATA.runs.length : 0);
  if (!n) { alert("Aucune run affichée à masquer."); return; }
  if(!confirm("Masquer les "+n+" run(s) actuellement affichées ? (les posts ne sont pas supprimés de Facebook — c'est juste masqué ici, tu peux annuler via l'API restore si besoin)")) return;
  fetch("/api/reports/runs/dismiss", { method:"POST", headers:{ "x-dashboard-token":TOKEN, "Content-Type":"application/json" }, body:JSON.stringify({ dismissAllVisible: true }) })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ OPEN.clear(); load(true); })
    .catch(function(e){ alert("Erreur : "+e.message); });
}

function arm(){ if(timer) clearInterval(timer); if(document.getElementById("auto").checked){ timer=setInterval(function(){ load(false); }, 30000); } }
document.getElementById("refresh").addEventListener("click", function(){ load(true); });
document.getElementById("hideAll").addEventListener("click", hideAll);
document.getElementById("auto").addEventListener("change", arm);
load(false); arm();

(function(){
  var btn = document.getElementById("scrollTopBtn");
  if (!btn) return;
  var ticking = false;
  function update(){ ticking = false; btn.classList.toggle("isVisible", (window.scrollY || document.documentElement.scrollTop || 0) > 320); }
  window.addEventListener("scroll", function(){ if (ticking) return; ticking = true; window.requestAnimationFrame(update); }, { passive:true });
  btn.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  update();
})();
</script>
