<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Runs report — Facebook autopilot</title>
<style>
  :root{
    --bg:#0e1217; --bg2:#141a22; --card:#1a222c; --card2:#202a36; --line:#27323f;
    --tx:#e6edf3; --mut:#8b98a8; --dim:#5d6b7c;
    --blue:#4ea1ff; --green:#3fb950; --amber:#d6a531; --red:#f0625a; --violet:#a779e9;
    --r:14px; --sh:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 75% -10%,#16202b 0,var(--bg) 55%) fixed;
    color:var(--tx); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:max(14px,env(safe-area-inset-top)) 14px 60px;
  }
  /* FULL WIDTH (operator 2026-07-25): was capped at 1080px, which wrapped the dense per-post / per-product
   tables on a wide screen. Fill the viewport, with a large upper bound for ultrawide monitors. */
.wrap{max-width:2560px;margin:0 auto}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top h1{font-size:1.22rem;margin:0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
  .top h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.16)}
  .sub{color:var(--mut);font-size:.82rem;margin-top:3px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx);
    padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--card2);border-color:#37475a}
  .btn:active{transform:translateY(1px)}
  .toggle{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:.82rem;user-select:none;cursor:pointer}
  .toggle input{accent-color:var(--blue);width:16px;height:16px}
  .upd{color:var(--dim);font-size:.76rem;white-space:nowrap}
  /* LIVE banner */
  .livecard{background:linear-gradient(180deg,#142433,#111a22);border:1px solid #2a4258;border-radius:14px;padding:14px 16px;margin:4px 0 16px;box-shadow:var(--sh)}
  .livecard .lh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.98rem;color:#bfe0ff}
  .livecard .lblink{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(63,185,80,.18);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(63,185,80,0)}}
  .livecard .lp{color:var(--mut);font-size:.86rem;margin:7px 0 2px}
  .livecard .lp b{color:var(--tx);font-variant-numeric:tabular-nums}
  /* run accordion */
  .runcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
  .runcard[open]{border-color:#33485c}
  .runcard > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:14px 15px;user-select:none}
  .runcard > summary::-webkit-details-marker{display:none}
  .runcard > summary:hover{background:var(--card2)}
  .rchev{color:var(--mut);font-size:.85rem;transition:transform .15s;flex:0 0 auto;width:12px}
  .runcard[open] .rchev{transform:rotate(90deg)}
  .rmain{display:flex;align-items:center;gap:8px;min-width:0}
  .rdate{font-weight:700;font-size:.92rem;white-space:nowrap}
  .rlive{font-size:.62rem;font-weight:800;letter-spacing:.5px;color:#06210f;background:var(--green);border-radius:5px;padding:2px 7px;animation:pulse 1.4s infinite}
  .rposts{color:var(--mut);font-size:.84rem;white-space:nowrap}
  .rrate{font-weight:700;font-size:.98rem;white-space:nowrap;margin-left:auto}
  .rrate small{font-size:.72rem;color:var(--mut);font-weight:600}
  .runc{font-size:.72rem;color:var(--red);white-space:nowrap;font-weight:600}
  .runc.pending{color:var(--amber)}
  .rdel{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1;transition:.15s}
  .rdel:hover{background:rgba(240,98,90,.14);border-color:rgba(240,98,90,.5);color:#ff8a83}
  .rbody{padding:6px 15px 16px;border-top:1px solid var(--line)}
  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin:12px 0 6px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.85}
  .stat.g::before{background:var(--green)} .stat.a::before{background:var(--amber)}
  .stat.r::before{background:var(--red)} .stat.v::before{background:var(--violet)}
  .stat .k{color:var(--mut);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:1.6rem;font-weight:760;margin-top:5px;line-height:1.05;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:.92rem;color:var(--mut);font-weight:600}
  .stat .x{color:var(--dim);font-size:.73rem;margin-top:3px}
  h2{font-size:.9rem;color:var(--tx);margin:18px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
  h2 .ln{flex:1;height:1px;background:var(--line)}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .grp{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
  .grp .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .grp .row{display:flex;justify-content:space-between;font-size:.84rem;padding:4px 0;color:var(--mut)}
  .grp .row b{color:var(--tx);font-variant-numeric:tabular-nums}
  .tag{font-size:.68rem;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .bar{height:7px;border-radius:5px;background:#0c1116;overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#57d06a);border-radius:5px;transition:width .4s}
  .bar.warn > i{background:linear-gradient(90deg,var(--amber),#e6bf52)}
  .bar.bad  > i{background:linear-gradient(90deg,var(--red),#f6837c)}
  .tablecard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  thead th{text-align:left;color:var(--mut);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;
    padding:10px 12px;background:#10161d;border-bottom:1px solid var(--line)}
  tbody td{padding:9px 12px;border-bottom:1px solid #1d262f;font-variant-numeric:tabular-nums;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#192129}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 8px}
  .pill.x{color:var(--mut);background:rgba(139,152,168,.12)}
  .pill.c0{color:#b98bff;background:rgba(167,121,233,.13)}
  .pill.c1{color:#5fb6ff;background:rgba(78,161,255,.13)}
  .pill.c2{color:#6bcf8f;background:rgba(63,185,80,.13)}
  .pill.c3{color:#f0cd72;background:rgba(214,165,49,.13)}
  .pill.c4{color:#ff9d7a;background:rgba(240,120,80,.13)}
  .pill.c5{color:#7ad4d0;background:rgba(60,180,175,.13)}
  .ok{color:var(--green)} .no{color:var(--red);font-weight:600} .slow{color:var(--amber)}
  .empty{padding:46px 20px;text-align:center;color:var(--mut)}
  .err{background:rgba(240,98,90,.1);border:1px solid rgba(240,98,90,.35);color:#ffb4ae;border-radius:12px;padding:14px 16px;margin:14px 0;font-size:.86rem}
  .reco{border-radius:11px;padding:11px 15px;margin:2px 0 14px;font-size:.86rem;font-weight:500}
  .reco.warn{background:rgba(214,165,49,.12);border:1px solid rgba(214,165,49,.4);color:#f0cd72}
  .reco.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.32);color:#7ee08a}
  .reco b{font-weight:800}
  .foot{color:var(--dim);font-size:.74rem;text-align:center;margin-top:26px}
  .foot a{color:var(--dim)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media(max-width:640px){
    body{padding:12px 10px 50px}
    .top h1{font-size:1.08rem}
    .rposts{display:none}
    .stat .v{font-size:1.4rem}
    table.detail thead{display:none}
    table.detail,table.detail tbody,table.detail tr,table.detail td{display:block;width:100%}
    table.detail tr{border-bottom:1px solid var(--line);padding:8px 4px}
    table.detail td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:12px}
    table.detail td::before{content:attr(data-l);color:var(--mut);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  }
  .scrollTopBtn{position:fixed;right:20px;bottom:20px;z-index:89;width:44px;height:44px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:50%;background:var(--card2);color:var(--tx);font-size:1.05rem;line-height:1;
    cursor:pointer;box-shadow:var(--sh);opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .18s ease,transform .18s ease,border-color .15s}
  .scrollTopBtn.isVisible{opacity:1;transform:translateY(0);pointer-events:auto}
  .scrollTopBtn:hover{border-color:var(--blue);color:var(--blue)}
  .scrollTopBtn:active{transform:translateY(1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1><span class="dot"></span> Runs report</h1>
      <div class="sub">Facebook autopilot — generated from logs (no AI). Click a card to expand it.</div>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="auto" checked> Auto 30s</label>
      <span class="upd" id="upd"></span>
      <button class="btn" id="hideAll" title="Hide all runs currently shown (non-destructive — the posts stay on Facebook)">🗑 Hide all</button>
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </div>

  <div id="err"></div>
  <div id="reco"></div>
  <div id="pendingunclustered"></div>
  <div id="openbudget"></div>
  <div id="live"></div>
  <div id="runs"><div class="empty"><span class="spin"></span> Loading the report…</div></div>
  <div id="probprof"></div>

  <div class="foot" id="foot"></div>
</div>

<button id="scrollTopBtn" class="scrollTopBtn" type="button" title="Back to top" aria-label="Back to top">&#8593;</button>

<script>
"use strict";
var TOKEN = "__DASHBOARD_TOKEN__";
var DATA = null, timer = null;
var OPEN = new Set(); // startedAt of cards the operator expanded — preserved across auto-refresh

function fmtTime(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ return "—"; } }
function fmtDate(iso){ if(!iso) return "—"; try{ var d=new Date(iso); return d.toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }catch(e){ return "—"; } }
function fmtGap(s){ if(s==null) return "—"; if(s<90) return s+"s"; return (s/60).toFixed(1)+"m"; }
function gapClass(s){ if(s==null) return "no"; if(s>180) return "slow"; return "ok"; }
// explicit "Xm Ys" format (operator: "show average posting time in minutes AND seconds")
function fmtMinSec(s){ if(s==null) return "—"; s=Math.round(s); var m=Math.floor(s/60), sec=s%60; return m+"m "+(sec<10?"0":"")+sec+"s"; }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
// GENERIC, N-GROUP-SCALABLE (2026-07-04 review fix): __reportGroupName no longer emits fixed literal names
// ("o-group"/"4854") for a hardcoded 2-group set, so a literal-string check here left every group looking
// identically grey. Hash the (arbitrary, any-length) group name into one of a small color palette instead --
// deterministic (the same group always gets the same color across a whole report) and scales to any group count
// without a code change; colors may repeat past 6 concurrent groups, but the group's real name/id is always the
// visible label, so identity is never ambiguous even if two groups share a color.
function grpPill(g){
  if (!g || g === "autre") return '<span class="pill x">'+esc(g)+'</span>';
  var h = 0; for (var i = 0; i < g.length; i++) { h = (h * 31 + g.charCodeAt(i)) | 0; }
  var idx = Math.abs(h) % 6;
  return '<span class="pill c'+idx+'">'+esc(g)+'</span>';
}
function rateBar(p){ var cls = p>=90?"":(p>=70?"warn":"bad"); return '<div class="bar '+cls+'"><i style="width:'+Math.max(2,Math.min(100,p))+'%"></i></div>'; }
function statCard(k,v,x,cls){ return '<div class="stat '+(cls||"")+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="x">'+esc(x)+'</div></div>'; }
// TOTAL ELAPSED, as a live stopwatch (operator request): "how much time from the start until now".
// For the LIVE run this must TICK — the page only reloads every 30s, so a value baked in at render time
// would sit frozen and look broken. The value element carries the two timestamps as data-attributes and a
// 1s interval below rewrites just that text, so the counter runs smoothly without re-fetching anything.
function fmtElapsed(ms){
  if (ms == null || !isFinite(ms) || ms < 0) return "—";
  var s = Math.floor(ms/1000);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  var p2 = function(n){ return (n<10?"0":"")+n; };
  return (h>0 ? h+"h "+p2(m)+"m "+p2(sec)+"s" : m+"m "+p2(sec)+"s");
}
function elapsedCard(r){
  var fromMs = Date.parse(r.startedAt || 0);
  if (!isFinite(fromMs)) return "";
  // live run -> count to NOW (ticking); finished run -> freeze at its last post
  var live = !!r.live;
  var toIso = live ? "" : (r.endedAt || r.startedAt || "");
  var nowMs = live ? Date.now() : Date.parse(toIso || 0);
  var val = '<span class="elapsedTick" data-from="'+esc(r.startedAt)+'" data-to="'+esc(toIso)+'">'
    + fmtElapsed(nowMs - fromMs) + '</span>';
  return statCard(live ? "Elapsed (live)" : "Total duration", val,
    live ? "since the run started — live counter" : "first post to last post", live ? "v" : "");
}
// one global ticker for every elapsed card currently on screen
setInterval(function(){
  var els = document.querySelectorAll(".elapsedTick");
  for (var i=0;i<els.length;i++){
    var el = els[i];
    var from = Date.parse(el.getAttribute("data-from") || 0);
    if (!isFinite(from)) continue;
    var toAttr = el.getAttribute("data-to") || "";
    if (toAttr) continue; // finished run: value is fixed, nothing to tick
    el.textContent = fmtElapsed(Date.now() - from);
  }
}, 1000);

function load(force){
  var u = "/api/reports/runs" + (force?"?force=1":"");
  document.getElementById("refresh").innerHTML = '<span class="spin"></span> …';
  fetch(u, { headers: { "x-dashboard-token": TOKEN }, cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ DATA=j; document.getElementById("err").innerHTML=""; render(); })
    .catch(function(e){ document.getElementById("err").innerHTML='<div class="err">⚠ Unable to load the report: '+esc(e.message)+' — open this page via <b>/report</b> (the server injects the token).</div>'; })
    .finally(function(){ document.getElementById("refresh").innerHTML="↻ Refresh"; });
}

function render(){
  if(!DATA) return;
  document.getElementById("upd").textContent = "Updated " + fmtTime(DATA.generatedAt);
  document.getElementById("foot").textContent = (DATA.runCount||0)+" run(s) — source : facebook-live-posts.jsonl + events.log + watchdog";

  // global banners (reconcile / open-budget / problem accounts)
  renderGlobals();

  // LIVE run banner
  var lv = DATA.live || {};
  var liveEl = document.getElementById("live");
  if (lv.armed) {
    var tgt = lv.target || null;
    var done = lv.postedThisRun || 0;
    var pct = tgt ? Math.min(100, Math.round(done/tgt*100)) : null;
    liveEl.innerHTML = '<div class="livecard">'
      + '<div class="lh"><span class="lblink"></span> Run in progress</div>'
      + '<div class="lp"><b>'+done+'</b>'+(tgt? ' / <b>'+tgt+'</b>' : '')+' posts published'+(pct!=null? ' &middot; '+pct+'%':'')+'</div>'
      + (pct!=null? rateBar(pct) : '') + '</div>';
  } else liveEl.innerHTML = '';

  // RUNS accordion (collapsed by default)
  var runs = DATA.runs || [];
  var runsEl = document.getElementById("runs");
  if(!runs.length){ runsEl.innerHTML = '<div class="tablecard"><div class="empty">No run recorded yet.<br>The report fills in from the first post.</div></div>'; return; }
  runsEl.innerHTML = runs.map(function(r,i){ return runCard(r,i); }).join("");
}

function runCard(r,i){
  var rate=r.commentRate;
  var sa = esc(r.startedAt);
  var ea = esc(r.endedAt || r.startedAt); // dismiss key = endedAt (restart-stable)
  var open = OPEN.has(r.startedAt) ? ' open' : '';
  return '<details class="runcard" data-sa="'+sa+'" ontoggle="onToggle(this)"'+open+'>'
    + '<summary>'
      + '<span class="rchev">▸</span>'
      + '<span class="rmain"><span class="rdate">'+esc(fmtDate(r.startedAt))+'</span>'
      + (r.live?'<span class="rlive">● LIVE</span>':(i===0?'<span class="pill x">latest</span>':''))+'</span>'
      + '<span class="rposts">'+r.posts+' posts &middot; '+r.durationMin+'m'+(r.avgPostIntervalSec!=null?' &middot; ~'+fmtMinSec(r.avgPostIntervalSec)+'/post':'')+'</span>'
      + '<span class="rrate '+(rate>=90?"ok":rate>=70?"slow":"no")+'">'+rate+'%<small> comm.</small></span>'
      + (r.uncommented? '<span class="runc">'+r.uncommented+' without</span>':'')
      + ((r.pendingApproval&&r.pendingApproval.count)? '<span class="runc pending">'+r.pendingApproval.count+' pending</span>':'')
      + '<button class="rdel" title="Remove this run from the report" onclick="dismiss(event,\''+sa+'\',\''+ea+'\')">✕</button>'
    + '</summary>'
    + '<div class="rbody">'+runBody(r)+'</div>'
    + '</details>';
}

function runBody(r){
  var ramTxt = r.minRamPct==null ? "—" : (r.minRamPct+"%");
  var chrTxt = r.chromePeak==null ? "—" : r.chromePeak;
  // APPROVAL WAIT SUMMARY (2026-07-20, operator: "how much time was it approved in"): a top-level stat card so
  // this is visible without scrolling down to the per-post "Approved after waiting" table.
  var __waitedMins = (r.detail||[]).filter(function(d){ return d.wasPendingApproval; })
    .map(function(d){ return d.approvalDurationMinutes!=null ? d.approvalDurationMinutes : d.approvalWaitMinutes; })
    .filter(function(m){ return m!=null; });
  var approvalWaitCard = "";
  if (__waitedMins.length) {
    var __avgWait = Math.round(__waitedMins.reduce(function(a,b){ return a+b; },0) / __waitedMins.length);
    var __sorted = __waitedMins.slice().sort(function(a,b){ return a-b; });
    var __maxWait = __sorted[__sorted.length-1];
    approvalWaitCard = statCard("Approval wait", __avgWait+'<small> min avg</small>', __waitedMins.length+" post(s) waited, max "+__maxWait+" min", __avgWait>=15?"r":(__avgWait>=8?"a":"g"));
  }
  // ---- FULL CYCLE / APPROVAL / BREAKDOWN METRICS (operator 2026-07-26) -------------------------------
  // Every number below is computed ONLY from fields the server actually records. Where a stat cannot be
  // honestly derived it is shown as "—" rather than guessed. Note the detail rows contain PUBLISHED posts
  // only, so a profile that failed to post at all never appears here -- these are "performance on work that
  // landed", not "success rate of every attempt". The labels say so explicitly.
  var det = r.detail || [];
  var cyc = det.filter(function(d){ return d.cycleSec != null; }).map(function(d){ return d.cycleSec; });
  var avgCycle = cyc.length ? Math.round(cyc.reduce(function(a,b){return a+b;},0)/cyc.length) : null;
  var appr = det.filter(function(d){ return d.approvalDurationMinutes != null; }).map(function(d){ return d.approvalDurationMinutes; });
  var avgAppr = appr.length ? (appr.reduce(function(a,b){return a+b;},0)/appr.length) : null;
  var pend = det.filter(function(d){ return d.wasPendingApproval; });
  var pendOk = pend.filter(function(d){ return !!d.commentedAt; });
  var pendPct = pend.length ? Math.round(pendOk.length*100/pend.length) : null;

  var cycleCard = statCard("Full cycle (average)", avgCycle!=null?fmtGap(avgCycle):"—",
    "from post submitted to comment verified" + (cyc.length? " • "+cyc.length+" posts" : ""),
    avgCycle==null?"":(avgCycle>=900?"r":(avgCycle>=480?"a":"g")));
  var apprCard = statCard("Approval (average)", avgAppr!=null?(Math.round(avgAppr*10)/10+" min"):"—",
    appr.length? appr.length+" post"+(appr.length>1?"s":"")+" went through a moderator" : "no moderated posts",
    avgAppr==null?"":(avgAppr>=15?"r":(avgAppr>=6?"a":"g")));
  var pendCard = statCard("Pending posts completed", pendPct!=null?(pendPct+'<small>%</small>'):"—",
    pend.length? pendOk.length+"/"+pend.length+" ended up commented" : "no pending posts",
    pendPct==null?"":(pendPct>=90?"g":(pendPct>=70?"a":"r")));

  var html = '<div class="stats">'
    + elapsedCard(r)
    + cycleCard
    + apprCard
    + pendCard
    + statCard("Posts published", r.posts, "over "+r.durationMin+" min", "")
    + statCard("Average post time", fmtMinSec(r.avgPostIntervalSec), "between posts going public (includes moderator-approval wait)", "v")
    + statCard("Unique products", (r.uniqueProducts||0), (r.productsInBoth||0)+" in both groups", (r.uniqueProducts? (r.productsInBoth>0?"g":"a") : ""))
    + (r.contentFreshness ? statCard("Fresh harvested", r.contentFreshness.fresh, r.contentFreshness.reusedUnder24h+" reused ≤24h, "+r.contentFreshness.reusedUnder48h+" reused ≤48h"+(r.contentFreshness.reusedOver48h?", "+r.contentFreshness.reusedOver48h+" older (pre-fix)":""), (r.contentFreshness.reusedOver48h>0?"r":(r.contentFreshness.fresh>0?"g":"a"))) : "")
    + statCard("Commented", r.commentRate+'<small>%</small>', r.commented+"/"+r.posts+" • "+r.uncommented+" without", r.commentRate>=90?"g":(r.commentRate>=70?"a":"r"))
    + statCard("Average comment time", fmtGap(r.gap.avgSec), "from post recorded published to comment verified (approval wait not included)", (r.gap.avgSec>=240?"r":(r.gap.avgSec>=120?"a":"g")))
    + statCard("Median delay", fmtGap(r.gap.medianSec), "max "+fmtGap(r.gap.maxSec), "v")
    + approvalWaitCard
    + statCard("Chrome peak", chrTxt, "min free RAM "+ramTxt, (r.chromePeak&&r.chromePeak>120)?"r":"g")
    + statCard("Restarts", r.restarts, r.restarts? "server restarted":"none — stable", r.restarts?"a":"g")
    + ((r.pendingApproval&&r.pendingApproval.count)? statCard("Awaiting approval", r.pendingApproval.count, "moderator hasn't passed yet", "a") : "")
    + '</div>';
  // AWAITING APPROVAL (operator 2026-07-13: "should be inside the task section" -- this run/task IS the
  // container, so the pending list belongs nested inside its own body, not broken out to a separate page-wide
  // section). First thing rendered in this task's body, right after its stat cards.
  var pend = (r.pendingApproval && r.pendingApproval.items) || [];
  if (pend.length) {
    html += '<h2>Awaiting approval <span class="ln"></span> <span class="tag">'+pend.length+'</span></h2>';
    html += '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>Group</th><th>Submitted</th><th>Waiting</th><th>Posted by</th><th>Moderator</th></tr></thead><tbody>';
    html += pend.map(function(p){
      var old = p.ageMinutes>=60;
      var poster = p.publisherProfileId ? (p.publisherProfileId + (p.publisherProfile? ' — '+esc(p.publisherProfile) : '')) : '—';
      var mod = p.moderatorProfileId ? (p.moderatorProfileId + (p.moderatorProfile? ' — '+esc(p.moderatorProfile) : '')) : (p.profileId||'—');
      return '<tr>'
        + '<td data-l="Group">'+grpPill(p.group)+'</td>'
        + '<td data-l="Submitted">'+fmtTime(p.startedAt)+'</td>'
        + '<td data-l="Waiting" class="'+(old?"no":"slow")+'">'+p.ageMinutes+' min'+(old?' ⚠':'')+'</td>'
        + '<td data-l="Posted by">'+poster+'</td>'
        + '<td data-l="Moderator">'+mod+'</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  // ALREADY APPROVED, AFTER WAITING (operator 2026-07-14: "I don't see history of the ones pending that are
  // already approved after waiting and how much time it took, in same section"). The per-post Approval column
  // further down (Post detail) already carries this (approvedByModerator + approvalDurationMinutes,
  // 2026-07-11), but it's buried far below this section on a long page. Surface the same data here too, right
  // next to the still-pending list, so both halves of the approval story (waiting now / waited-and-resolved)
  // read together without scrolling. Pure client-side re-render of r.detail already sent by the server --
  // no server change, takes effect on next page load.
  // WIDENED (2026-07-20, operator: still couldn't see this -- traced live: requiring approvedByModerator hid
  // EVERY post approved via the soft-success/background path (approvalClicked=true but never resolved to the
  // strict "approved_and_verified" moderator-credit record), which is the DOMINANT outcome today given the
  // moderator-pool constraints -- so this section rendered EMPTY on real runs that had posts wait 7-8+ min and
  // still get approved. wasPendingApproval alone is correct: every row in r.detail already represents a post
  // that WAS published, so a pending-flagged one unambiguously got approved one way or another.
  var resolvedApprovals = (r.detail||[]).filter(function(d){ return d.wasPendingApproval; });
  if (resolvedApprovals.length) {
    html += '<h2>Approved after waiting <span class="ln"></span> <span class="tag">'+resolvedApprovals.length+'</span></h2>';
    html += '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>Group</th><th>Posted by</th><th>Approved by</th><th title="Time from admin-approval starting to the post going live">Waited</th><th>Commented</th><th>Commented by</th></tr></thead><tbody>';
    html += resolvedApprovals.map(function(d){
      var poster = d.profilePub ? (d.profilePub + (d.profilePubLabel? ' — '+esc(d.profilePubLabel) : '')) : '—';
      var commenter = d.profileCom ? (d.profileCom + (d.profileComLabel? ' — '+esc(d.profileComLabel) : '')) : '—';
      var waitedMin = d.approvalDurationMinutes!=null ? d.approvalDurationMinutes : d.approvalWaitMinutes;
      var waitedTxt = waitedMin!=null ? waitedMin+' min' : '?';
      var approvedByTxt = d.approvedByModerator ? esc(String(d.approvedByModerator)) : '<span class="slow" title="Approved via the background/soft-success path -- no specific moderator was recorded">soft-approved</span>';
      return '<tr>'
        + '<td data-l="Group">'+grpPill(d.group)+'</td>'
        + '<td data-l="Posted by">'+poster+'</td>'
        + '<td data-l="Approved by">'+approvedByTxt+'</td>'
        + '<td data-l="Waited" class="'+(waitedMin!=null && waitedMin>=30?'no':'slow')+'">'+waitedTxt+'</td>'
        + '<td data-l="Commented">'+(d.commentedAt?(fmtTime(d.commentedAt)+' <span class="pill x '+gapClass(d.gapSec)+'" title="Time from this post being recorded published to the comment landing (a post still awaiting moderation is recorded published once the approval attempt resolves)">'+fmtGap(d.gapSec)+' after publish</span>'):'<span class="no">not yet</span>')+'</td>'
        + '<td data-l="Commented by">'+(d.commentedAt?commenter:'<span class="no">—</span>')+'</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  var gks = Object.keys(r.byGroup||{});
  if(gks.length){
    html += '<h2>By group <span class="ln"></span></h2><div class="cards2">';
    html += gks.map(function(g){
      var v=r.byGroup[g];
      var stuck = !v.posts && v.held>0;
      return '<div class="grp"><div class="gh"><span>'+grpPill(g)+'</span><span class="tag">'+v.posts+' posts</span></div>'
        + (v.posts ? '<div class="row"><span>Commented</span><b>'+v.commented+'/'+v.posts+'</b></div>'
          + '<div class="row"><span>Rate</span><b class="'+(v.commentRate>=90?"ok":v.commentRate>=70?"slow":"no")+'">'+v.commentRate+'%</b></div>'
          + '<div class="row"><span>Median delay</span><b>'+fmtGap(v.gapMedianSec)+'</b></div>'
          + rateBar(v.commentRate) : (stuck ? '<div class="row"><span class="no">⚠ No post — blocked</span></div>' : '<div class="row"><span style="opacity:.6">No post yet</span></div>'))
        + (v.held>0 ? '<div class="row"><span>Held (no free commenter)</span><b class="'+(stuck?"no":"slow")+'">'+v.held+'</b></div>' : '')
        + '</div>';
    }).join("");
    html += '</div>';
  }
  // ---- PERFORMANCE BREAKDOWN + BARS (operator 2026-07-26: "which profiles are weak, which groups are weak") --
  // Bars are plain divs (no chart library): the page is served under a strict CSP and must stay dependency-free.
  // SCOPE HONESTY: r.detail only contains posts that actually PUBLISHED. A profile that failed to post at all
  // never appears, so this is "how did the work that landed perform", NOT "success rate of every attempt".
  // Headings say so, so nobody reads a missing profile as a good profile.
  function __agg(rows, keyFn, labelFn){
    var m = {};
    rows.forEach(function(d){
      var k = keyFn(d); if (k == null || k === "" ) return;
      if (!m[k]) m[k] = { k: k, label: labelFn ? labelFn(d) : String(k), n: 0, ok: 0, cyc: [] };
      m[k].n++;
      if (d.commentedAt) m[k].ok++;
      if (d.cycleSec != null) m[k].cyc.push(d.cycleSec);
    });
    return Object.keys(m).map(function(k){
      var e = m[k];
      e.pct = e.n ? Math.round(e.ok*100/e.n) : 0;
      e.avgCyc = e.cyc.length ? Math.round(e.cyc.reduce(function(a,b){return a+b;},0)/e.cyc.length) : null;
      return e;
    }).sort(function(a,b){ return (a.pct - b.pct) || (b.n - a.n); }); // worst first — that is what needs action
  }
  function __breakdown(title, note, rows, minN){
    if (!rows.length) return "";
    var h = '<h2>'+esc(title)+' <span class="ln"></span> <span class="tag">'+rows.length+'</span></h2>'
      + '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>'+esc(note)+'</th><th>Posts</th><th>Commented</th><th>Rate</th><th>Avg cycle</th></tr></thead><tbody>';
    h += rows.map(function(e){
      var weak = (e.n >= (minN||3) && e.pct < 90);
      return '<tr>'
        + '<td data-l="Name">'+(weak?'<span class="pill r" title="under 90% commented, on at least '+(minN||3)+' posts">weak</span> ':'')+esc(e.label)+'</td>'
        + '<td data-l="Posts">'+e.n+'</td>'
        + '<td data-l="Commented">'+e.ok+'</td>'
        + '<td data-l="Rate">'+rateBar(e.pct)+'<small>'+e.pct+'%</small></td>'
        + '<td data-l="Cycle">'+(e.avgCyc!=null?fmtGap(e.avgCyc):"—")+'</td>'
        + '</tr>';
    }).join("");
    return h + '</tbody></table></div>';
  }
  html += __breakdown("By group", "Group (weakest first)", __agg(det, function(d){ return d.group; }), 3);
  html += __breakdown("By posting profile", "Publisher profile — on its published posts", __agg(det, function(d){ return d.profilePub; }, function(d){ return d.profilePubLabel || String(d.profilePub); }), 3);
  html += __breakdown("By commenting profile", "Commenter profile — verified comments", __agg(det.filter(function(d){ return d.profileCom; }), function(d){ return d.profileCom; }, function(d){ return d.profileComLabel || String(d.profileCom); }), 3);

  // BY PRODUCT — each harvested product, its number, how many times posted, in which groups, by which profiles
  var prods = r.products || [];
  if (prods.length) {
    html += '<h2>By product <span class="ln"></span> <span class="tag">'+(r.productsInBoth||0)+'/'+(r.uniqueProducts||prods.length)+' in both groups</span></h2>';
    html += '<div class="tablecard"><table class="detail"><thead><tr>'
      + '<th>Product</th><th>Title</th><th>Posted</th><th>Groups</th><th>Profiles</th></tr></thead><tbody>';
    var totalGroups = r.configuredGroupCount || 0;
    html += prods.map(function(p){
      var gl = Object.keys(p.groups||{}).map(function(g){ return grpPill(g)+' ×'+p.groups[g]; }).join(' ');
      var multi = (p.groupCount>=2) ? '<span class="ok">✓ '+p.groupCount+' groups</span>' : '<span class="slow">⚠ only 1</span>';
      // LIFETIME COVERAGE (operator 2026-07-15: "why he dont post the same product in all groupes"): a product
      // often finishes covering every configured group across SEVERAL reuse cycles (sometimes days apart, gated
      // by each group's own reuse cooldown), not within one run — this run's own groupCount alone made a fully-
      // covered product look stuck. Show the all-time figure next to it so that's clear at a glance.
      if (totalGroups) {
        var lifetime = p.lifetimeGroupCount!=null ? p.lifetimeGroupCount : p.groupCount;
        if (lifetime >= totalGroups) multi += ' <span class="pill x ok" title="This product has reached every configured group across all runs, not just this one">✓ '+totalGroups+'/'+totalGroups+' all-time</span>';
        else multi += ' <span class="pill x '+(lifetime>p.groupCount?'ok':'slow')+'" title="Groups reached across ALL runs, not just this one">'+lifetime+'/'+totalGroups+' all-time</span>';
      }
      var prof = (p.profiles||[]).join(', ');
      var ttl = (p.title||p.shortKey||'').toString();
      var freshBadge = p.isFreshProduct ? '<span class="pill x ok" title="This product was harvested and posted for the first time ever during this run">&#127793; Fresh</span>' : '';
      return '<tr>'
        + '<td data-l="Product"><b>P'+p.num+'</b> '+freshBadge+'</td>'
        + '<td data-l="Title" title="'+esc(p.key)+'">'+esc(ttl.length>46?ttl.slice(0,46)+'…':ttl)+'</td>'
        + '<td data-l="Posted"><b>'+p.total+'×</b> '+multi+'</td>'
        + '<td data-l="Groups">'+gl+'</td>'
        + '<td data-l="Profiles">'+esc(prof)+'</td></tr>';
    }).join("");
    html += '</tbody></table></div>';
  }
  html += '<h2>Post detail <span class="ln"></span></h2><div class="tablecard"><table class="detail"><thead><tr>'
    + '<th>#</th><th>Product</th><th>Group</th><th>Published</th><th>Commented</th><th>Approval</th><th title="Time between this post going live and the comment landing">Comment time</th><th>Profiles</th></tr></thead><tbody>';
  html += (r.detail||[]).map(function(d,i){
    var pubTxt = d.profilePub ? (d.profilePub + (d.profilePubLabel? " - "+esc(d.profilePubLabel) : "")) : "—";
    var comTxt = d.profileCom ? (d.profileCom + (d.profileComLabel? " - "+esc(d.profileComLabel) : "")) : "—";
    var prof = d.profilePub ? (pubTxt + " → " + comTxt) : "—";
    var freshTag = d.isFreshPost ? ' <span class="pill x ok" title="First-ever publish of this product">&#127793;</span>' : '';
    var pnum = d.productNum ? ('<span class="pill x" title="'+esc(d.productKey||"")+'">P'+d.productNum+'</span>'+freshTag) : '—';
    // 2026-07-11 (operator): show WHICH moderator approved this post + how long the approval took.
    var appr = '—';
    if (d.approvedByModerator) {
      appr = '<span class="pill x" title="Moderator who approved this pending post">✔ '+esc(String(d.approvedByModerator))+'</span>'
           + (d.approvalDurationMinutes!=null? ' <span class="'+(d.approvalDurationMinutes>=30?'no':'slow')+'">'+d.approvalDurationMinutes+'min</span>':'');
    } else if (d.wasPendingApproval) {
      appr = '<span class="slow">pending…</span>';
    }
    return '<tr>'
      + '<td data-l="#">'+(i+1)+'</td>'
      + '<td data-l="Product">'+pnum+'</td>'
      + '<td data-l="Group">'+grpPill(d.group)+'</td>'
      + '<td data-l="Published">'+fmtTime(d.publishedAt)+'</td>'
      + '<td data-l="Commented">'+(d.commentedAt?(fmtTime(d.commentedAt)+(d.wasPendingApproval?' <span class="pill x" title="This post waited for a moderator\'s approval before it could be commented.">⏳ waiting '+(d.approvalWaitMinutes!=null?d.approvalWaitMinutes+'min':'?')+'</span>':'')):(d.approvalVerification==="soft_clicked"?'<span class="slow">approval in progress…</span>':'<span class="no">not commented</span>'))+'</td>'
      + '<td data-l="Approval">'+appr+'</td>'
      + '<td data-l="Comment time" class="'+gapClass(d.gapSec)+'" title="Time between this post going live and the comment landing">'+fmtGap(d.gapSec)+'</td>'
      + '<td data-l="Profiles">'+esc(prof)+'</td></tr>';
  }).join("");
  html += '</tbody></table></div>';
  return html;
}

function renderGlobals(){
  var rc = DATA.reconcile || {};
  var recoEl = document.getElementById("reco");
  var bits = [];
  if (rc.pending) bits.push('<b>'+rc.pending+'</b> interrupted, recovery in progress');
  if (rc.needsReview) bits.push('<b>'+rc.needsReview+'</b> to review manually');
  if (rc.recovered) bits.push('<b>'+rc.recovered+'</b> recovered');
  if (rc.released) bits.push('<b>'+rc.released+'</b> restarted');
  if (rc.pending || rc.needsReview) recoEl.innerHTML = '<div class="reco warn">⚠ Recovery after interruption (kill mid-post): ' + bits.join(' · ') + '</div>';
  else if (rc.recovered || rc.released) recoEl.innerHTML = '<div class="reco ok">✓ Auto recovery after interruption: ' + bits.join(' · ') + ' — no silent loss</div>';
  else recoEl.innerHTML = '';

  // PENDING, NO TASK CARD YET (2026-07-04): posts awaiting moderator approval whose task/run has zero landed
  // posts so far -- clustering (buildRunReports) only creates a task card around LANDED posts, so a task that's
  // 100% pending right now has no card to nest inside yet. Kept as its own small banner (not inside a task
  // section, because there IS no task section for it) so it's not silently invisible until its first post lands.
  var pu = DATA.pendingUnclustered || [];
  var puEl = document.getElementById("pendingunclustered");
  if (pu.length) {
    var byG = {};
    pu.forEach(function(p){ byG[p.group] = (byG[p.group]||0)+1; });
    var bits2 = Object.keys(byG).map(function(g){ return '<b>'+byG[g]+'</b> '+g; });
    puEl.innerHTML = '<div class="reco warn">⏳ '+pu.length+' post(s) submitted, awaiting moderator approval (no task shown yet): ' + bits2.join(' · ') + '</div>';
  } else { puEl.innerHTML = ''; }

  var ob = DATA.openBudget || null;
  var obEl = document.getElementById("openbudget");
  if (ob && (ob.opensToday || ob.effectiveLimit)) {
    var used = ob.opensToday || 0, lim = ob.effectiveLimit;
    var KOMODE = { force_on:'keep-open <b>forced ON</b>', force_off:'keep-open <b>forced OFF</b>', auto_on_tight_plan:'keep-open <b>auto ON</b> (tight plan)', auto_on_near_limit:'keep-open <b>auto ON</b> (near limit)', auto_off_roomy_plan:'keep-open auto OFF (roomy plan)', auto_off_plan_unknown:'keep-open auto OFF (unknown plan)' };
    var ko = KOMODE[ob.mode] || (ob.keepOpenOn ? 'keep-open ON' : 'keep-open off');
    var planSrc = ob.planLimit ? 'known plan' : (ob.learnedLimit ? 'auto-learned' : '');
    var head, cls;
    if (lim) {
      var line = '<b>' + used + '</b> / ~' + lim + ' opens today (' + planSrc + (ob.pct != null ? ', ' + ob.pct + '%' : '') + ', remaining ~' + ob.remaining + ') — ' + ko;
      cls = ob.nearLimit ? 'warn' : 'ok';
      head = (ob.nearLimit ? '⚠ Near the ixBrowser opens limit: ' : '✓ ixBrowser opens budget: ') + line;
    } else { cls = 'ok'; head = '✓ ixBrowser opens today: <b>' + used + '</b> — unknown plan (auto-learned at first 1018) — ' + ko; }
    obEl.innerHTML = '<div class="reco ' + cls + '">' + head + '</div>';
  } else { obEl.innerHTML = ''; }

  var pp = DATA.problemProfiles || [];
  var ppEl = document.getElementById("probprof");
  if (pp.length) {
    var ppRows = pp.map(function (p) { return '<tr><td><b>p' + p.profileId + '</b></td><td class="no">' + p.realFails + '</td><td class="' + (p.unblocks ? 'slow' : '') + '">' + (p.unblocks || 0) + '</td><td>' + esc(p.lastReal || '—') + '</td></tr>'; }).join("");
    ppEl.innerHTML = '<h2>⚠ Problem accounts (waste time) <span class="ln"></span></h2>'
      + '<div class="reco warn" style="margin:0 0 8px">Real failures (group access / account block) over 24h — <b>NOT</b> the ixBrowser quota victims (1018/1004).</div>'
      + '<div class="tablecard"><table><thead><tr><th>Profile</th><th>Real failures</th><th>Unblocks</th><th>Last reason</th></tr></thead><tbody>' + ppRows + '</tbody></table></div>';
  } else { ppEl.innerHTML = ''; }
}

function onToggle(el){ var sa=el.getAttribute("data-sa"); if(el.open) OPEN.add(sa); else OPEN.delete(sa); }

function dismiss(ev, sa, ea){
  ev.stopPropagation(); ev.preventDefault();
  if(!confirm("Remove this run from the report? (the posts are NOT deleted from Facebook — it's just hidden here)")) return;
  fetch("/api/reports/runs/dismiss", { method:"POST", headers:{ "x-dashboard-token":TOKEN, "Content-Type":"application/json" }, body:JSON.stringify({ endedAt: ea || sa, startedAt: sa }) })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ OPEN.delete(sa); load(true); })
    .catch(function(e){ alert("Delete error: "+e.message); });
}

function hideAll(){
  var n = (DATA && DATA.runs ? DATA.runs.length : 0);
  if (!n) { alert("No run shown to hide."); return; }
  if(!confirm("Hide the "+n+" run(s) currently shown? (the posts are NOT deleted from Facebook — it's just hidden here, you can undo via the restore API if needed)")) return;
  fetch("/api/reports/runs/dismiss", { method:"POST", headers:{ "x-dashboard-token":TOKEN, "Content-Type":"application/json" }, body:JSON.stringify({ dismissAllVisible: true }) })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ OPEN.clear(); load(true); })
    .catch(function(e){ alert("Error: "+e.message); });
}

function arm(){ if(timer) clearInterval(timer); if(document.getElementById("auto").checked){ timer=setInterval(function(){ load(false); }, 30000); } }
document.getElementById("refresh").addEventListener("click", function(){ load(true); });
document.getElementById("hideAll").addEventListener("click", hideAll);
document.getElementById("auto").addEventListener("change", arm);
load(false); arm();

(function(){
  var btn = document.getElementById("scrollTopBtn");
  if (!btn) return;
  var ticking = false;
  function update(){ ticking = false; btn.classList.toggle("isVisible", (window.scrollY || document.documentElement.scrollTop || 0) > 320); }
  window.addEventListener("scroll", function(){ if (ticking) return; ticking = true; window.requestAnimationFrame(update); }, { passive:true });
  btn.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  update();
})();
</script>
</body>
</html>
